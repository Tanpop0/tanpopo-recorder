name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache-dependency-path: |
            apps/cli/go.sum
            apps/gui/go.sum

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/gui/frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: apps/gui/frontend
        run: npm ci

      - name: Build frontend
        working-directory: apps/gui/frontend
        run: npm run build

      - name: Test GUI module
        working-directory: apps/gui
        run: go test ./...

      - name: Test CLI module
        working-directory: apps/cli
        run: go test ./...
